# 模型配置：OpenAI 兼容端点
# 解析约定见 backend/app/config.py：
#   Settings.endpoints()      -> endpoints
#   Settings.vision_routing() -> vision_routing
#   Settings.compress()       -> compress
# 各端点至少包含 base_url / model_name / api_key；modality 为可选（auto / multimodal / text）。
#
# 说明：本文件为提交到仓库的通用模板，已清除真实密钥与私有端点，请按实际环境填入。

endpoints:
  main:                       # 主对话模型端点
    base_url: http://127.0.0.1:8001/v1   # 请替换为你的 OpenAI 兼容端点地址
    model_name: your-main-model          # 请替换为你的主对话模型名
    api_key: ""                          # 请填入你的 API Key
    modality: auto            # 内容模态：auto | multimodal（图文）| text（纯文本）
  vision:                     # 多模态/视觉模型端点（用于图片理解等）
    base_url: http://127.0.0.1:8002/v1
    model_name: your-vision-model
    api_key: ""
    modality: auto
  compressor:                 # 历史会话压缩（map_reduce 摘要）专用端点
    base_url: http://127.0.0.1:8003/v1
    model_name: your-compress-model
    api_key: ""
    modality: auto

# 视觉内容的路由策略：
#   prefer_vision_model       优先使用 vision 端点处理视觉内容（推荐）
#   prefer_main_if_multimodal 若 main 端点 modality 支持 multimodal，则回调 main
#   vision_model_only         视觉内容仅允许 vision 端点处理
vision_routing:
  policy: prefer_vision_model

# 长上下文压缩策略：当会话超过 context_window / threshold 时触发 map_reduce 摘要。
compress:
  enabled: true               # 是否启用会话压缩
  threshold: 0.8              # 触发压缩的上下文占用阈值
  context_window: 8192        # 单模型上下文窗口大小（token）
  keep_recent_turns: 6        # 压缩时保留最近 N 轮未压缩原始消息
  strategy: map_reduce        # 压缩策略（map_reduce：分块摘要后合并）
  prompt: "请将以下对话压缩为保留要点的简明摘要，不要遗漏关键指令与事实。"  # 摘要生成提示词

# 以下 catalogs 为模型目录（附加信息，非 config.py 必需字段，可按需扩充/删除）。
catalogs:
  local:
    name: local
    label: 本地 vLLM/Ollama
    base_url: http://127.0.0.1:8001/v1
    api_key: ""
    models:
    - your-main-model
    - your-vision-model
    - your-compress-model