# =============================================================================
# aiassistant 反向代理模板（nginx）
#
# 架构：
#   外部流量(80) → nginx → / 静态前端 (dist)  /  /api、/api/chat → 网关(127.0.0.1:8080)
#
# 部署：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/aiassistant.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 启用 HTTPS（可选，见文件末尾 443 预留块）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ai.example.com   # 自动签发并把 80 跳 443
# =============================================================================

# 主入口：监听 80，直接提供前端并反代网关
server {
    listen 80;
    listen [::]:80;
    # 部署时替换为真实域名或 IP；无域名可留 "_" 匹配所有 Host
    server_name _;

    # 前端构建产物（npm run build 生成，见 install.sh）
    root /opt/aiassistant/frontend/dist;
    index index.html;

    # SPA 历史路由回退：所有非文件请求都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 网关 REST API（http://127.0.0.1:8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        # 兼容网关可能用到的事件流/长连接
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 聊天 WebSocket（/api/chat）→ 网关同一地址
    # 注意：WebSocket 升级头必须连同较长的读写超时，避免长连接被 60s 默认掐断
    location /api/chat {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}

