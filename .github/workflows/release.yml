name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Pack
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          ver="${VERSION#v}"
          if [ -z "$ver" ]; then ver="0.1.0"; fi
          VERSION="$ver" make pack
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/manifest.json
            dist/install.ps1
            dist/install.cmd
            dist/install.sh
          generate_release_notes: true
